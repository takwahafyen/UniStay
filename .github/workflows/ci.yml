name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test-and-lint:
    name: Lint, Static Analysis & Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: student_housing_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Elasticsearch
        run: |
          docker run -d --name elasticsearch \
            -p 9200:9200 \
            -e "discovery.type=single-node" \
            -e "xpack.security.enabled=false" \
            -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" \
            docker.elastic.co/elasticsearch/elasticsearch:8.13.4
          
          echo "Waiting for Elasticsearch to become ready..."
          for i in {1..30}; do
            if curl -s http://localhost:9200/_cluster/health | grep -q 'green\|yellow'; then
              echo "✅ Elasticsearch is ready!"
              break
            fi
            sleep 2
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, gd, redis
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Prepare Laravel Directories & Permissions
        run: |
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          chmod -R 777 bootstrap/cache storage

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Database Migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: student_housing_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Run Code Style Check (Pint)
        run: vendor/bin/pint --test app config database routes tests

      - name: Run Static Analysis (PHPStan)
        run: vendor/bin/phpstan analyse --error-format=github

      - name: Run Test Suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: student_housing_test
          DB_USERNAME: root
          DB_PASSWORD: root
          ELASTICSEARCH_HOSTS: "http://127.0.0.1:9200"
        run: vendor/bin/phpunit --testdox

  docker-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/Dockerfile
          push: false
          tags: student-housing-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
